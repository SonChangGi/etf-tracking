name: Update ETF tracking data

on:
  workflow_dispatch:
    # Reviewed manual runs default to strict validation so updater, npm test,
    # assessment, and commit failures surface as failed workflow runs.
    inputs:
      backfill_all:
        description: 'Fetch all weekdays since each ETF listing date'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      backfill_start_date:
        description: 'Optional bounded historical start date (YYYY-MM-DD); ignored when backfill_all=true'
        required: false
        default: ''
        type: string
      refresh_existing:
        description: 'Refetch already stored usable snapshots instead of filling missing dates only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      strict_validation:
        description: 'Fail this manual run on updater/test/commit errors; set false only for diagnostics'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
  schedule:
    # 08:15 KST Tue-Sat: earlier staggered primary provider refresh after the U.S. close; later retries handle Korean ETF/provider publication lag.
    - cron: "15 23 * * 1-5"
    # 10:15/12:15 KST Tue-Sat: 2-hour retries if provider files arrive late.
    - cron: "15 1 * * 2-6"
    - cron: "15 3 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # GitHub warned that Node 20 JavaScript actions are being deprecated. Opt in now
  # so manual validation does not warn/fail only because the runner default changes.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AUTOMATION_COMMITTER_NAME: github-actions[bot]
  AUTOMATION_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

concurrency:
  group: etf-tracking-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the production branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "ETF production refreshes must run from ${DEFAULT_BRANCH}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: setup-node
        with:
          node-version: '22'
      - name: Update data with soft-fail status
        id: update
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.strict_validation != 'true' }}
        run: |
          set -uo pipefail
          update_args=(--output-dir data --soft-fail)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backfill_all }}" = "true" ]; then
            update_args+=(--backfill-all)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.backfill_start_date }}" ]; then
            update_args+=(--backfill-start-date "${{ inputs.backfill_start_date }}")
          else
            update_args+=(--backfill-days 10)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_existing }}" = "true" ]; then
            update_args+=(--refresh-existing)
          fi
          python3 scripts/update_data.py "${update_args[@]}"
      - name: Verify static site and data
        id: verify
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.strict_validation != 'true' }}
        run: npm test
      - name: Assess whether generated data is safe to commit
        id: assess
        if: always()
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          output = Path(os.environ["GITHUB_OUTPUT"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          update = os.environ.get("UPDATE_OUTCOME", "missing")
          verify = os.environ.get("VERIFY_OUTCOME", "missing")
          event_name = os.environ.get("EVENT_NAME", "")
          event_schedule = os.environ.get("EVENT_SCHEDULE", "")
          final_retry = event_name == "schedule" and event_schedule == "15 3 * * 2-6"
          status_path = Path("data/automation-status.json")
          status = {}
          if status_path.exists():
              try:
                  status = json.loads(status_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  status = {"runStatus": "unreadable_status", "error": str(exc)}
          else:
              status = {"runStatus": "missing_status", "error": "data/automation-status.json was not written"}
          run_status = str(status.get("runStatus") or "unknown")
          safe = update == "success" and verify == "success" and run_status == "ok"
          expected_wait = (
              update == "success"
              and verify == "success"
              and run_status == "waiting_for_data"
              and not final_retry
          )
          hard_failure = not safe and not expected_wait
          reasons = []
          if update != "success":
              reasons.append(f"updater step {update}")
          if verify != "success":
              reasons.append(f"verification step {verify}")
          if run_status not in {"ok", "waiting_for_data"}:
              reasons.append(f"automation status {run_status}")
          if run_status == "waiting_for_data" and final_retry:
              reasons.append("provider data remained unavailable at the final scheduled retry")
          failure_reason = "; ".join(reasons) or ("provider data is not available yet" if expected_wait else "unknown automation failure")
          output.write_text(
              "\n".join([
                  f"safe_to_commit={'true' if safe else 'false'}",
                  f"expected_wait={'true' if expected_wait else 'false'}",
                  f"final_retry={'true' if final_retry else 'false'}",
                  f"hard_failure={'true' if hard_failure else 'false'}",
                  f"run_status={run_status}",
                  f"failure_reason={failure_reason}",
              ]) + "\n",
              encoding="utf-8",
          )
          lines = [
              "## ETF tracking automation assessment",
              f"- update step: `{update}`",
              f"- verify step: `{verify}`",
              f"- automation status: `{run_status}`",
              f"- safe to commit data: `{str(safe).lower()}`",
              f"- expected provider wait: `{str(expected_wait).lower()}`",
              f"- final scheduled retry: `{str(final_retry).lower()}`",
              f"- hard automation failure: `{str(hard_failure).lower()}`",
              f"- reason: {failure_reason}",
          ]
          for warning in status.get("warnings", [])[:10]:
              lines.append(f"- warning: {warning}")
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          if hard_failure:
              print(f"::error::ETF automation failed: {failure_reason}. Last-good public data was preserved.")
          elif expected_wait:
              print("::notice::ETF provider data is not available yet; last-good public data was preserved for the scheduled retry.")
          PY
      - name: Commit refreshed data
        id: commit-data
        if: steps.assess.outputs.safe_to_commit == 'true'
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.strict_validation != 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "${AUTOMATION_COMMITTER_NAME}"
          git config user.email "${AUTOMATION_COMMITTER_EMAIL}"
          git add data
          if git diff --cached --quiet; then
            echo "No safe data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat > /tmp/etf-tracking-data-commit-message <<'MSG'
          Keep ETF tracking data fresh

          Constraint: scheduled and reviewed manual provider refreshes must pass updater, npm test, and safe-to-commit gates.
          Confidence: high
          Scope-risk: narrow
          Directive: Expected provider/price delays must be recorded in data/automation-status.json instead of silently publishing partial data.
          Tested: npm test
          Not-tested: Manual investment interpretation.
          MSG
          git commit -F /tmp/etf-tracking-data-commit-message
          if [[ "$(git show -s --format=%an HEAD)" != "${AUTOMATION_COMMITTER_NAME}" ]] \
            || [[ "$(git show -s --format=%ae HEAD)" != "${AUTOMATION_COMMITTER_EMAIL}" ]]; then
            echo "Refusing to publish a generated commit with an unexpected identity." >&2
            exit 1
          fi
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Confirm workflow owns Pages publication
        id: pages-owner
        if: steps.assess.outputs.safe_to_commit == 'true' && steps.commit-data.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(timeout 30s gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [[ "${build_type}" != "workflow" ]]; then
            echo "GitHub Pages build_type must be workflow; received ${build_type}." >&2
            echo "Disable the legacy branch publisher before this workflow becomes the sole deployment owner." >&2
            exit 1
          fi
          echo "Confirmed this Actions workflow is the sole configured Pages publisher."
      - name: Verify current main matches the tested candidate
        id: current-main
        if: steps.assess.outputs.safe_to_commit == 'true' && steps.commit-data.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ steps.commit-data.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Commit step did not expose a valid source SHA." >&2
            exit 1
          fi
          timeout 60s git fetch origin "${DEFAULT_BRANCH}" --depth=1
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "${local_sha}" != "${EXPECTED_SOURCE_SHA}" ]] \
            || [[ "${remote_sha}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "Refusing stale Pages artifact: local=${local_sha} remote=${remote_sha} expected=${EXPECTED_SOURCE_SHA}." >&2
            exit 1
          fi
          {
            echo "## ETF Pages deployment identity"
            echo "- owner: workflow"
            echo "- source SHA: \`${EXPECTED_SOURCE_SHA}\`"
            echo "- generated commit: \`${{ steps.commit-data.outputs.changed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        if: steps.current-main.outcome == 'success'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload exact static site
        if: steps.current-main.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Reject a stale main after artifact upload
        id: pre-deploy-main
        if: steps.current-main.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ steps.commit-data.outputs.source_sha }}
        run: |
          set -euo pipefail
          timeout 60s git fetch origin "${DEFAULT_BRANCH}" --depth=1
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "${remote_sha}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "Main advanced to ${remote_sha} after upload; refusing stale artifact ${EXPECTED_SOURCE_SHA}." >&2
            exit 1
          fi
      - name: Deploy exact static site
        id: deployment
        if: steps.pre-deploy-main.outcome == 'success'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public site bytes
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          expected_page_url="https://sonchanggi.github.io/etf-tracking/"
          if [[ "${PAGE_URL%/}/" != "${expected_page_url}" ]]; then
            echo "Unexpected Pages deployment URL: ${PAGE_URL}" >&2
            exit 1
          fi
          mapfile -d '' public_json < <(find dist/data -type f -name '*.json' -print0 | sort -z)
          if (( ${#public_json[@]} == 0 )); then
            echo "No built public JSON files were found." >&2
            exit 1
          fi
          public_files=(
            dist/index.html
            dist/assets/app.js
            dist/assets/styles.css
            dist/assets/shared-nav.css
            dist/shared-platform/dist/index.js
          )
          public_files+=("${public_json[@]}")
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT
          for attempt in {1..12}; do
            all_match=true
            for local_path in "${public_files[@]}"; do
              relative="${local_path#dist/}"
              remote_path="${readback_dir}/$(printf '%s' "$relative" | tr '/' '_')"
              url="${PAGE_URL%/}/${relative}?__etf_readback=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 \
                --max-time 120 \
                "$url" --output "$remote_path"; then
                all_match=false
                break
              fi
              if ! cmp --silent "$local_path" "$remote_path"; then
                all_match=false
                break
              fi
            done
            if [[ "$all_match" == "true" ]]; then
              echo "Verified ${#public_files[@]} public site files byte-for-byte."
              exit 0
            fi
            if (( attempt < 12 )); then
              sleep $((attempt * 5))
            fi
          done
          echo "Public ETF Pages readback did not converge to the deployed artifact." >&2
          exit 1
      - name: Upload automation diagnostics
        if: always() && hashFiles('data/automation-status.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: etf-tracking-automation-status
          path: |
            data/automation-status.json
            data/status.json
          retention-days: 14
      - name: Strict manual failure gate
        if: always() && github.event_name == 'workflow_dispatch' && inputs.strict_validation == 'true' && (steps.update.outcome != 'success' || steps.verify.outcome != 'success' || steps.assess.outputs.safe_to_commit != 'true' || steps.commit-data.outcome == 'failure')
        run: |
          echo "Strict validation requested and one or more gates failed." >&2
          exit 1
      - name: Scheduled automation failure gate
        if: always() && github.event_name == 'schedule' && (steps.assess.outputs.hard_failure == 'true' || steps.commit-data.outcome == 'failure')
        env:
          FAILURE_REASON: ${{ steps.assess.outputs.failure_reason }}
        run: |
          echo "Scheduled ETF automation failed: ${FAILURE_REASON:-commit step failed}" >&2
          echo "The last-good public dataset was preserved and this failed run is the notification signal." >&2
          exit 1
